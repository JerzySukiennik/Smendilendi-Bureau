<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smendiłendi Bureau — build progress</title>
<style>
  :root{
    --paper:#f4f1ea; --ink:#1d1a16; --dim:#6f6659; --rule:#d9d2c5;
    --pass:#2f7d4f; --fail:#b23b32; --wip:#b8860b; --accent:#1d1a16;
  }
  @media (prefers-color-scheme:dark){
    :root{ --paper:#16140f; --ink:#efe9dd; --dim:#9a9083; --rule:#312c24;
           --pass:#6bbf8a; --fail:#e08078; --wip:#d8ac47; --accent:#efe9dd; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:32px 24px 80px;max-width:1000px;margin:0 auto}
  h1{font-size:22px;letter-spacing:-.01em;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .bar{display:flex;gap:2px;margin:22px 0 6px;height:10px}
  .bar i{flex:1;background:var(--rule);border-radius:2px}
  .bar i.pass{background:var(--pass)} .bar i.wip{background:var(--wip)} .bar i.fail{background:var(--fail)}
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px}
  th{text-align:left;font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.06em;
     text-transform:uppercase;padding:0 10px 6px 0;border-bottom:1px solid var(--rule)}
  td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  tr:hover td{background:color-mix(in srgb,var(--rule) 30%,transparent)}
  .st{font-weight:600;white-space:nowrap}
  .st.pass{color:var(--pass)} .st.fail{color:var(--fail)} .st.wip{color:var(--wip)}
  .piece{font-weight:600;white-space:nowrap}
  .role{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .gap{color:var(--fail);display:block;margin-top:3px;font-size:12.5px}
  .detail{color:var(--dim);display:block;margin-top:3px;font-size:12.5px}
  .m{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
  .foot{margin-top:26px;color:var(--dim);font-size:12px}
  a{color:inherit}
  .empty{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>
<h1>Smendiłendi Bureau</h1>
<div class="sub">Live build log — builder and critic rounds. Auto-refreshes every 15 s.
  <a href="../index.html" target="_blank">open the game →</a></div>
<div class="bar" id="bar"></div>
<div class="sub" id="tally"></div>
<table><thead><tr><th>Time</th><th>Piece</th><th>R</th><th>Status</th><th>What happened</th></tr></thead>
<tbody id="rows"></tbody></table>
<div class="foot" id="foot"></div>
<script>
const fmt = s => new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  let db; try { db = await (await fetch('progress.json?'+Date.now())).json(); } catch { return; }
  const es = db.entries.slice().reverse();
  document.getElementById('bar').innerHTML = db.entries.map(e=>`<i class="${esc(e.status)}"></i>`).join('') || '<i></i>';
  const pieces = new Set(db.entries.map(e=>e.piece));
  const passed = new Set(db.entries.filter(e=>e.status==='pass'&&e.role==='critic').map(e=>e.piece));
  document.getElementById('tally').textContent =
    `${db.entries.length} entries · ${pieces.size} pieces in play · ${passed.size} cleared by a critic`;
  document.getElementById('rows').innerHTML = es.length ? es.map(e=>`<tr>
    <td class="m">${fmt(e.at)}</td>
    <td class="piece">${esc(e.piece)}<br><span class="role">${esc(e.role)}</span></td>
    <td class="m">${e.round ?? ''}</td>
    <td class="st ${esc(e.status)}">${esc(e.status)}</td>
    <td>${esc(e.headline)}
      ${e.gap?`<span class="gap">biggest gap: ${esc(e.gap)}</span>`:''}
      ${e.detail?`<span class="detail">${esc(e.detail)}</span>`:''}
      ${e.metrics?`<span class="detail m">${esc(Object.entries(e.metrics).map(([k,v])=>k+'='+v).join('  '))}</span>`:''}
    </td></tr>`).join('') : '<tr><td colspan="5" class="empty">nothing logged yet</td></tr>';
  document.getElementById('foot').textContent = 'last update: ' + (db.updated ? new Date(db.updated).toLocaleString() : '—');
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
