<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smendiłendi Bureau — office harness</title>
<link rel="stylesheet" href="/src/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
<style>html,body{margin:0;height:100%;background:#111}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="debug" hidden></div>
</div>
<!--
  Office dev harness. The office is one of five modes and main.js always boots
  the menu first, so getting a deterministic, correctly framed screenshot of the
  studio through the real page means fighting the mode stack. This page boots
  the Engine with ONLY the office in it.

  Query parameters:
    ?pose=hero|window|desks|teapoint|models   named camera pose (office.js POSES)
    &x=&z=&yaw=&pitch=                        explicit pose, metres and degrees
    &sun=1                                    kill every fill, sun only
    &hud=0                                    hide the HUD (for luminance sampling)
    &staff=2                                  hire N employees before the shot
    &measure=1                                print the luma report into #report

  The page sets window.__ready = true once the scene has settled, and
  window.__report to the measurement JSON, so a headless screenshot run can wait
  for the first and read the second.
-->
<div id="report" style="position:fixed;left:8px;bottom:8px;color:#0f0;font:11px monospace;z-index:99"></div>
<script type="module">
import { Engine } from '/src/core/engine.js';
import { Input } from '/src/core/input.js';
import { AudioBus } from '/src/core/audio.js';
import { Assets } from '/src/core/assets.js';
import { createState } from '/src/core/state.js';
import { OfficeMode } from '/src/office/office-mode.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('view');
const state = createState();
state.set('session.playerId', 'p1');
state.set('players', {
  p1: { id: 'p1', nick: q.get('nick') || 'Jurek', color: '#e2725b' },
});
if (q.get('players') === '2') {
  state.set('players.p2', { id: 'p2', nick: 'Narek', color: '#3f8f7c' });
}

const engine = new Engine(canvas);
const input = new Input(canvas);
const audio = new AudioBus({ enabled: false });
const assets = new Assets();
const ctx = { engine, state, input, audio, assets, net: null };
engine.setContext(ctx);
const debug = engine.attachDebug(document.getElementById('debug'));
if (q.get('debug') === '1') debug.toggle(true);

const mode = new OfficeMode();
engine.register(mode);
engine.push(mode);
engine.start();

const office = mode.office;
window.SBO = { engine, office, mode, state, input };

if (q.get('staff')) {
  const n = Math.min(3, parseInt(q.get('staff'), 10) || 0);
  office.economy.credit(200000, 'harness');
  for (let i = 0; i < n; i++) office.staff.hire(['architect', 'intern', 'partner'][i % 3]);
  office.invalidateShadows();
}
if (q.get('tier')) {
  const t = parseInt(q.get('tier'), 10) || 1;
  office.economy.credit(400000, 'harness');
  while (office.upgrades.studio < t) office.upgrades.buy('studio');
  while (office.upgrades.computer < t) office.upgrades.buy('computer');
}
if (q.get('hud') === '0') office.hudEl.classList.add('hidden');
if (q.get('sun') === '1') office.soloSun(true);

const pose = office.pose(q.get('pose') || 'hero');
if (q.has('x')) office.player.pos.x = parseFloat(q.get('x'));
if (q.has('z')) office.player.pos.z = parseFloat(q.get('z'));
if (q.has('yaw')) office.player.yaw = parseFloat(q.get('yaw')) * Math.PI / 180;
if (q.has('pitch')) office.player.pitch = parseFloat(q.get('pitch')) * Math.PI / 180;
if (q.has('eye')) office.player._eye = parseFloat(q.get('eye'));
office.player.enabled = false;
office.player.update(0.016, null);

// Settle, then report. 90 frames is enough for shader compilation, the shadow
// map, the nameplate font and the OS canvas to have landed.
const STOP_AT = parseInt(q.get('frames') || '90', 10);
let frames = 0;
engine.onUpdate(() => {
  frames++;
  if (frames === STOP_AT) {
    mode.measure().then((r) => {
      window.__report = r;
      const el = document.getElementById('report');
      el.textContent = q.get('measure') === '1'
        ? Object.entries(r).map(([k, v]) => `${k}=${v}`).join('  ') : '';
      window.__ready = true;
      // Stop scheduling frames so a headless --virtual-time-budget run can
      // decide the page is idle and take its screenshot.
      if (q.get('stop') !== '0') setTimeout(() => engine.stop(), 60);
    });
  }
});
// --- capture ---------------------------------------------------------------
// The browser pane screenshots at pane resolution, which is too small to judge
// a 5 mm chamfer or a 12/255 AO band. __shot renders the live scene at an
// explicit size and POSTs the PNG to a local receiver, exactly as
// tools/prop-sheet.html does, so progress/shots/ gets full-resolution frames.
window.__shotPort = 5411;
window.__shot = async (name, w = 1600, h = 900) => {
  const r = engine.renderer;
  const el = r.domElement;
  const oldW = el.width, oldH = el.height, oldPr = r.getPixelRatio();
  r.setPixelRatio(1);
  r.setSize(w, h, false);
  office.camera.aspect = w / h;
  office.camera.updateProjectionMatrix();
  mode.render(r);
  const url = el.toDataURL('image/png');
  const bin = atob(url.slice(url.indexOf(',') + 1));
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const blob = new Blob([buf], { type: 'image/png' });
  let res = 'no receiver';
  try {
    const rr = await fetch(`http://localhost:${window.__shotPort}/save?name=${encodeURIComponent(name)}`,
      { method: 'POST', body: blob });
    res = await rr.text();
  } catch (e) { res = 'ERR ' + e.message; }
  r.setSize(oldW, oldH, false);
  r.setPixelRatio(oldPr);
  office.camera.aspect = oldW / oldH;
  office.camera.updateProjectionMatrix();
  return { name, bytes: blob.size, res };
};

/** Move to a named or explicit pose, settle the frame, and return the pose. */
window.__go = (name, over = {}) => {
  const p = { ...office.pose(name), ...over };
  office.player.pos.set(p.x, 0, p.z);
  office.player.yaw = p.yaw * Math.PI / 180;
  office.player.pitch = p.pitch * Math.PI / 180;
  office.player.enabled = false;
  office.player.update(0.016, null);
  return p;
};

/** Render at a size and report the numbers the finish bar asks for. */
window.__probe = async (name, w = 1600, h = 900, col = 0.5) => {
  const r = engine.renderer;
  const el = r.domElement;
  const oldW = el.width, oldH = el.height, oldPr = r.getPixelRatio();
  r.setPixelRatio(1);
  r.setSize(w, h, false);
  office.camera.aspect = w / h;
  office.camera.updateProjectionMatrix();
  mode.render(r);
  const luma = office.sampleLuma(r);
  const band = Array.isArray(col) ? col.map((c) => office.junctionBand(r, c))
    : office.junctionBand(r, col);
  r.setSize(oldW, oldH, false);
  r.setPixelRatio(oldPr);
  office.camera.aspect = oldW / oldH;
  office.camera.updateProjectionMatrix();
  return { name, luma, band };
};

console.info('[harness] office only, pose', q.get('pose') || 'hero', pose);
</script>
</body>
</html>
